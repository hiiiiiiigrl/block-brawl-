        <!-- Game Over / Victory Modal -->

                    RETRY! (R)
                </button>

    <script>
        // --- AUDIO SYNTHESIZER ENGINE (Web Audio API) ---
        class WebAudioSynth {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.muted = false;
                this.bpm = 130;
                this.beatInterval = null;
                this.step = 0;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }

            playJumpSound() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playOrbSound(freqStart = 450, freqEnd = 1200) {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freqStart, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freqEnd, this.ctx.currentTime + 0.16);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.16);
            }

            playExplosionSound() {
                if (!this.ctx || this.muted) return;
                const bufferSize = this.ctx.sampleRate * 0.28;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1200, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.28);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.28);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start();
            }

            playCheckpointSound() {
                if (!this.ctx || this.muted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.07);
                osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.14);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.22);
            }

            playWinSound() {
                if (!this.ctx || this.muted) return;
                const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.18);
                });
            }

            startMusic(bpm = 130) {
                this.init();
                this.bpm = bpm;
                this.stopMusic();
                this.isPlaying = true;
                this.step = 0;
                const intervalMs = (60 / this.bpm / 4) * 1000;
                this.beatInterval = setInterval(() => this.onBeatStep(), intervalMs);
            }

            stopMusic() {
                this.isPlaying = false;
                if (this.beatInterval) {
                    clearInterval(this.beatInterval);
                    this.beatInterval = null;
                }
            }

            onBeatStep() {
                if (!this.isPlaying || !this.ctx || this.muted) return;
                const t = this.ctx.currentTime;

                // Punchy Chiptune Kick
                if (this.step % 4 === 0) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(160, t);
                    osc.frequency.exponentialRampToValueAtTime(35, t + 0.07);
                    gain.gain.setValueAtTime(0.35, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.07);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.07);

                    if (window.triggerPulse) window.triggerPulse();
                }

                // Chiptune Lead Synth
                if (this.step % 2 === 0) {
                    const notes = [329.63, 392.00, 440.00, 523.25, 440.00, 392.00, 329.63, 293.66];
                    const note = notes[(this.step / 2) % notes.length];
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(note, t);
                    gain.gain.setValueAtTime(0.08, t);
                    gain.gain.exponentialRampToValueAtTime(0.005, t + 0.1);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(t);
                    osc.stop(t + 0.1);
                }

                this.step = (this.step + 1) % 16;
            }
        }

        const audioSynth = new WebAudioSynth();

        // --- LEVEL DEFINITIONS (BALANCED MEDIUM DIFFICULTY) ---
        const LEVELS = [
            {
                name: "Level 1: Diaz Warmup",
                desc: "NORMAL • Speed 7.2 • Double Spikes & Timed Jump Orbs",
                speed: 7.2,
                bpm: 130,
                primaryColor: "#00ff88",
                secondaryColor: "#00f3ff",
                floorColor: "#00ffaa",
                // Map symbols: 0=empty, 1=single spike, 2=double spike, 3=block, 5=yellow orb, 6=blue orb, 7=pink orb, 8=jump pad, 9=floating block
                map: "000000000000001000000200000033000000100000500009900000020000033000007000033000080003330000001100000500009900000220000000000"
            },
            {
                name: "Level 2: Geometry Diaz",
                desc: "HARD • Speed 8.2 • Blue Orbs, Multi-Tier Platforms & Gaps",
                speed: 8.2,
                bpm: 138,
                primaryColor: "#ffcc00",
                secondaryColor: "#ff00aa",
                floorColor: "#ffaa00",
                map: "00000000000020000033000010000330000600099000020003300001000500099900022000330007000330008000333000020005000990000600000000"
            },
            {
                name: "Level 3: Diaz Challenge",
                desc: "INSANE • Speed 9.0 • Fast Orb Chains & Triple Spikes",
                speed: 9.0,
                bpm: 146,
                primaryColor: "#ff0055",
                secondaryColor: "#00f3ff",
                floorColor: "#ff0055",
                map: "00000000000020000033000022000330000500099000022003300005000600070003330002220033000800033300050009900002200000000"
            }
        ];

        // --- CANVAS SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const avatarCanvas = document.getElementById('avatarCanvas');
        const avatarCtx = avatarCanvas.getContext('2d');

        let currentLevelIdx = 0;
        let gameState = 'MENU'; // 'MENU', 'PLAYING', 'GAMEOVER', 'VICTORY'
        let practiceMode = true;
        let autoRestart = true;
        let attempts = 1;
        let cameraX = 0;
        let levelWidth = 0;
        let pulseIntensity = 0;
        let screenShake = 0;
        let practiceCheckpoints = [];
        let activeCheckpoint = null;
        let highScores = { 0: 0, 1: 0, 2: 0 };
        let isHoldingJump = false;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- DRAW PROFE DIAZ CUBE AVATAR ---
        function drawDiazCharacter(c, x, y, size, rotationDeg = 0, isGravityFlipped = false) {
            c.save();
            c.translate(x + size / 2, y + size / 2);
            c.rotate((rotationDeg * Math.PI) / 180);
            if (isGravityFlipped) c.scale(1, -1);

            const half = size / 2;

            // Skin-Toned Cube Base
            c.fillStyle = '#f7c59f';
            c.strokeStyle = '#ff9900';
            c.lineWidth = size * 0.08;
            
            c.beginPath();
            c.roundRect(-half, -half, size, size, size * 0.18);
            c.fill();
            c.stroke();

            // Inner Accent Border
            c.strokeStyle = '#00f3ff';
            c.lineWidth = size * 0.04;
            c.strokeRect(-half + size * 0.08, -half + size * 0.08, size * 0.84, size * 0.84);

            // Dark Curly Hair
            c.fillStyle = '#1c1326';
            const curlRadius = size * 0.18;
            const curls = [
                { dx: -0.38, dy: -0.48 },
                { dx: -0.18, dy: -0.55 },
                { dx: 0.18, dy: -0.55 },
                { dx: 0.38, dy: -0.48 },
                { dx: -0.48, dy: -0.28 },
                { dx: 0.48, dy: -0.28 },
                { dx: -0.50, dy: -0.06 },
                { dx: 0.50, dy: -0.06 }
            ];

            curls.forEach(spot => {
                c.beginPath();
                c.arc(spot.dx * size, spot.dy * size, curlRadius, 0, Math.PI * 2);
                c.fill();
            });

            // Dark-Rimmed Glasses
            c.strokeStyle = '#2b1810';
            c.fillStyle = 'rgba(255, 255, 255, 0.45)';
            c.lineWidth = size * 0.065;

            const glassW = size * 0.34;
            const glassH = size * 0.24;
            const glassY = -size * 0.05;

            c.beginPath();
            c.roundRect(-size * 0.39, glassY, glassW, glassH, size * 0.05);
            c.fill();
            c.stroke();

            c.beginPath();
            c.roundRect(size * 0.05, glassY, glassW, glassH, size * 0.05);
            c.fill();
            c.stroke();

            c.beginPath();
            c.moveTo(-size * 0.05, glassY + glassH * 0.35);
            c.lineTo(size * 0.05, glassY + glassH * 0.35);
            c.stroke();

            // Eyes & Smile
            c.fillStyle = '#0f172a';
            c.beginPath();
            c.arc(-size * 0.22, glassY + glassH * 0.5, size * 0.055, 0, Math.PI * 2);
            c.arc(size * 0.22, glassY + glassH * 0.5, size * 0.055, 0, Math.PI * 2);
            c.fill();

            c.strokeStyle = '#8b0000';
            c.lineWidth = size * 0.055;
            c.beginPath();
            c.arc(0, size * 0.18, size * 0.12, 0.15 * Math.PI, 0.85 * Math.PI, false);
            c.stroke();

            c.restore();
        }

        function renderAvatarPreview() {
            avatarCtx.clearRect(0, 0, avatarCanvas.width, avatarCanvas.height);
            drawDiazCharacter(avatarCtx, 15, 15, 90, 0);
        }
        renderAvatarPreview();

        // --- PLAYER MECHANICS & STANDARD PRECISION PHYSICS ---
        const player = {
            x: 100,
            y: 0,
            size: 46,
            vy: 0,
            rotation: 0,
            isGrounded: false,
            gravity: 1.35, // Standard responsive GD gravity
            gravityFlipped: false,
            jumpForce: -16.2,

            reset(groundY) {
                this.x = activeCheckpoint ? activeCheckpoint.x : 100;
                this.y = activeCheckpoint ? activeCheckpoint.y : groundY - this.size;
                this.vy = 0;
                this.rotation = 0;
                this.gravityFlipped = activeCheckpoint ? activeCheckpoint.gravityFlipped : false;
                this.isGrounded = true;
            },

            jump() {
                if (this.isGrounded) {
                    const mult = this.gravityFlipped ? 1 : -1;
                    this.vy = Math.abs(this.jumpForce) * mult;
                    this.isGrounded = false;
                    audioSynth.playJumpSound();
                }
            },

            triggerOrb(type) {
                const mult = this.gravityFlipped ? -1 : 1;
                if (type === 'yellow') {
                    this.vy = -18.0 * mult;
                    audioSynth.playOrbSound(400, 1100);
                } else if (type === 'blue') {
                    this.gravityFlipped = !this.gravityFlipped;
                    this.vy = -12.0 * (this.gravityFlipped ? -1 : 1);
                    audioSynth.playOrbSound(500, 300);
                } else if (type === 'pink') {
                    this.vy = -12.0 * mult;
                    audioSynth.playOrbSound(700, 1200);
                }
                this.isGrounded = false;
            },

            update(groundY, levelSpeed, obstacles) {
                this.x += levelSpeed;
                const effGravity = this.gravityFlipped ? -this.gravity : this.gravity;
                this.vy += effGravity;
                this.y += this.vy;

                // Floor / Ceiling Boundary Collision
                const floorPos = groundY - this.size;
                const ceilingPos = 50;

                if (!this.gravityFlipped && this.y >= floorPos) {
                    this.y = floorPos;
                    this.vy = 0;
                    this.isGrounded = true;
                    this.rotation = Math.round(this.rotation / 90) * 90;
                } else if (this.gravityFlipped && this.y <= ceilingPos) {
                    this.y = ceilingPos;
                    this.vy = 0;
                    this.isGrounded = true;
                    this.rotation = Math.round(this.rotation / 90) * 90;
                } else {
                    this.isGrounded = false;
                    this.rotation += (this.gravityFlipped ? -10.0 : 10.0);
                }

                // Platform Landing Collision
                for (let obs of obstacles) {
                    if (obs.type === 'block' || obs.type === 'floatingBlock') {
                        if (!this.gravityFlipped) {
                            const blockTop = obs.y;
                            if (
                                this.x + this.size > obs.x + 2 &&
                                this.x < obs.x + obs.w - 2 &&
                                this.y + this.size >= blockTop &&
                                this.y + this.size <= blockTop + this.vy + 10 &&
                                this.vy >= 0
                            ) {
                                this.y = blockTop - this.size;
                                this.vy = 0;
                                this.isGrounded = true;
                                this.rotation = Math.round(this.rotation / 90) * 90;
                            }
                        } else {
                            const blockBottom = obs.y + obs.h;
                            if (
                                this.x + this.size > obs.x + 2 &&
                                this.x < obs.x + obs.w - 2 &&
                                this.y <= blockBottom &&
                                this.y >= blockBottom + this.vy - 10 &&
                                this.vy <= 0
                            ) {
                                this.y = blockBottom;
                                this.vy = 0;
                                this.isGrounded = true;
                                this.rotation = Math.round(this.rotation / 90) * 90;
                            }
                        }
                    }
                }

                if (isHoldingJump && this.isGrounded) {
                    this.jump();
                }
            },

            // Standard precision hitbox (shrunk slightly for fair gameplay)
            getBounds() {
                const pad = 5;
                return {
                    x: this.x + pad,
                    y: this.y + pad,
                    w: this.size - pad * 2,
                    h: this.size - pad * 2
                };
            }
        };

        // --- PARTICLES & EXPLOSIONS ---
        let particles = [];
        let confetti = [];

        function createExplosion(x, y, levelConfig) {
            const colors = [levelConfig.primaryColor, levelConfig.secondaryColor, '#ffffff', '#ffcc00'];
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.5) * 16,
                    size: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        function createConfetti() {
            const colors = ['#00ff88', '#00f3ff', '#ffcc00', '#ff00aa', '#ff9900'];
            for (let i = 0; i < 90; i++) {
                confetti.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    vx: (Math.random() - 0.5) * 5,
                    vy: Math.random() * 4 + 2,
                    size: Math.random() * 8 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0,
                    decay: 0.005
                });
            }
        }

        function createTrail(x, y, levelConfig) {
            if (Math.random() < 0.7) {
                particles.push({
                    x: x + (Math.random() - 0.5) * 6,
                    y: y + player.size - 4,
                    vx: -3.0,
                    vy: (Math.random() - 0.5) * 2,
                    size: Math.random() * 5 + 2,
                    color: levelConfig.secondaryColor,
                    life: 0.5,
                    decay: 0.05
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = confetti.length - 1; i >= 0; i--) {
                const c = confetti[i];
                c.x += c.vx;
                c.y += c.vy;
                c.life -= c.decay;
                if (c.life <= 0) confetti.splice(i, 1);
            }
        }

        function drawParticles(c) {
            particles.forEach(p => {
                c.save();
                c.globalAlpha = p.life;
                c.fillStyle = p.color;
                c.shadowBlur = 6;
                c.shadowColor = p.color;
                c.fillRect(p.x - cameraX, p.y, p.size, p.size);
                c.restore();
            });

            confetti.forEach(conf => {
                c.save();
                c.globalAlpha = conf.life;
                c.fillStyle = conf.color;
                c.fillRect(conf.x, conf.y, conf.size, conf.size);
                c.restore();
            });
        }

        // --- MAP & OBSTACLE BUILDER ---
        let obstacles = [];
        const GRID_SIZE = 50;

        function buildLevelMap(levelConfig, groundY) {
            obstacles = [];
            const mapStr = levelConfig.map;

            for (let i = 0; i < mapStr.length; i++) {
                const char = mapStr[i];
                const x = (i + 5) * GRID_SIZE;

                if (char === '1') {
                    // Single Spike
                    obstacles.push({ type: 'spike', x: x, y: groundY - GRID_SIZE, w: GRID_SIZE, h: GRID_SIZE });
                } else if (char === '2') {
                    // Double Spike
                    obstacles.push({ type: 'spike', x: x, y: groundY - GRID_SIZE, w: GRID_SIZE, h: GRID_SIZE });
                    obstacles.push({ type: 'spike', x: x + GRID_SIZE, y: groundY - GRID_SIZE, w: GRID_SIZE, h: GRID_SIZE });
                } else if (char === '3') {
                    // Solid Block
                    obstacles.push({ type: 'block', x: x, y: groundY - GRID_SIZE, w: GRID_SIZE, h: GRID_SIZE });
                } else if (char === '5') {
                    // Yellow Orb Jump Pad
                    obstacles.push({ type: 'yellowOrb', x: x, y: groundY - GRID_SIZE * 1.6, w: 46, h: 46, hit: false });
                } else if (char === '6') {
                    // Blue Orb Gravity Flip
                    obstacles.push({ type: 'blueOrb', x: x, y: groundY - GRID_SIZE * 1.7, w: 46, h: 46, hit: false });
                } else if (char === '7') {
                    // Pink Orb
                    obstacles.push({ type: 'pinkOrb', x: x, y: groundY - GRID_SIZE * 1.5, w: 46, h: 46, hit: false });
                } else if (char === '8') {
                    // Jump Pad
                    obstacles.push({ type: 'pad', x: x, y: groundY - 14, w: GRID_SIZE, h: 14 });
                } else if (char === '9') {
                    // Floating Platform Block
                    obstacles.push({ type: 'floatingBlock', x: x, y: groundY - GRID_SIZE * 2.0, w: GRID_SIZE, h: GRID_SIZE });
                }
            }

            levelWidth = (mapStr.length + 10) * GRID_SIZE;
        }

        window.triggerPulse = function() {
            pulseIntensity = 1.0;
        };

        // --- PRECISION COLLISION DETECTION ---
        function checkCollisions(groundY) {
            const p = player.getBounds();

            for (let obs of obstacles) {
                if (obs.type === 'spike') {
                    // Standard triangular hitbox for spikes
                    if (
                        p.x + p.w > obs.x + 8 &&
                        p.x < obs.x + obs.w - 8 &&
                        p.y + p.h > obs.y + 8 &&
                        p.y < obs.y + obs.h
                    ) {
                        return true;
                    }
                } else if (obs.type.endsWith('Orb')) {
                    if (
                        p.x + p.w > obs.x - 8 &&
                        p.x < obs.x + obs.w + 8 &&
                        p.y + p.h > obs.y - 8 &&
                        p.y < obs.y + obs.h + 8
                    ) {
                        if (isHoldingJump && !obs.hit) {
                            obs.hit = true;
                            if (obs.type === 'yellowOrb') player.triggerOrb('yellow');
                            else if (obs.type === 'blueOrb') player.triggerOrb('blue');
                            else if (obs.type === 'pinkOrb') player.triggerOrb('pink');
                        }
                    } else {
                        obs.hit = false;
                    }
                } else if (obs.type === 'pad') {
                    if (
                        p.x + p.w > obs.x &&
                        p.x < obs.x + obs.w &&
                        p.y + p.h >= obs.y
                    ) {
                        player.triggerOrb('yellow');
                    }
                } else if (obs.type === 'block' || obs.type === 'floatingBlock') {
                    const isSideCrash = 
                        p.x + p.w > obs.x &&
                        p.x < obs.x + 8 &&
                        p.y + p.h > obs.y + 8 &&
                        p.y < obs.y + obs.h - 8;

                    if (isSideCrash) {
                        return true;
                    }
                }
            }
            return false;
        }

        // --- DRAW SCENE ---
        function drawScene() {
            const groundY = canvas.height - 120;
            const levelConfig = LEVELS[currentLevelIdx];
            pulseIntensity *= 0.92;

            ctx.save();
            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
                screenShake *= 0.85;
            }

            // 1. Background
            ctx.fillStyle = '#050a14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Pulsing Grid
            ctx.save();
            ctx.strokeStyle = levelConfig.primaryColor;
            ctx.globalAlpha = 0.12 + pulseIntensity * 0.15;
            ctx.lineWidth = 1;

            const gridOffset = cameraX % 50;
            for (let x = -gridOffset; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            ctx.restore();

            // 2. Floor & Ceiling Bounds
            ctx.save();
            ctx.fillStyle = '#090d1a';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillRect(0, 0, canvas.width, 50);

            ctx.strokeStyle = levelConfig.floorColor;
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15 + pulseIntensity * 15;
            ctx.shadowColor = levelConfig.floorColor;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.moveTo(0, 50);
            ctx.lineTo(canvas.width, 50);
            ctx.stroke();
            ctx.restore();

            // 3. Obstacles & Orbs
            obstacles.forEach(obs => {
                const screenX = obs.x - cameraX;

                if (screenX + obs.w > -60 && screenX < canvas.width + 60) {
                    ctx.save();

                    if (obs.type === 'spike') {
                        ctx.fillStyle = levelConfig.primaryColor;
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = levelConfig.primaryColor;

                        ctx.beginPath();
                        ctx.moveTo(screenX, obs.y + obs.h);
                        ctx.lineTo(screenX + obs.w / 2, obs.y);
                        ctx.lineTo(screenX + obs.w, obs.y + obs.h);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    } else if (obs.type === 'yellowOrb') {
                        ctx.fillStyle = '#ffcc00';
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 18;
                        ctx.shadowColor = '#ffcc00';
                        ctx.beginPath();
                        ctx.arc(screenX + obs.w / 2, obs.y + obs.h / 2, obs.w / 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    } else if (obs.type === 'blueOrb') {
                        ctx.fillStyle = '#00f3ff';
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 18;
                        ctx.shadowColor = '#00f3ff';
                        ctx.beginPath();
                        ctx.arc(screenX + obs.w / 2, obs.y + obs.h / 2, obs.w / 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    } else if (obs.type === 'pinkOrb') {
                        ctx.fillStyle = '#ff00aa';
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 18;
                        ctx.shadowColor = '#ff00aa';
                        ctx.beginPath();
                        ctx.arc(screenX + obs.w / 2, obs.y + obs.h / 2, obs.w / 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    } else if (obs.type === 'pad') {
                        ctx.fillStyle = '#ffcc00';
                        ctx.fillRect(screenX, obs.y, obs.w, obs.h);
                    } else if (obs.type === 'block' || obs.type === 'floatingBlock') {
                        ctx.fillStyle = '#111827';
                        ctx.strokeStyle = levelConfig.primaryColor;
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = levelConfig.primaryColor;

                        ctx.fillRect(screenX, obs.y, obs.w, obs.h);
                        ctx.strokeRect(screenX, obs.y, obs.w, obs.h);
                    }

                    ctx.restore();
                }
            });

            // 4. Practice Checkpoint Indicators
            if (practiceMode) {
                practiceCheckpoints.forEach((cp) => {
                    const screenX = cp.x - cameraX;
                    if (screenX > -50 && screenX < canvas.width + 50) {
                        ctx.save();
                        ctx.fillStyle = (activeCheckpoint === cp) ? '#00ff88' : '#00aaff';
                        ctx.shadowBlur = 12;
                        ctx.shadowColor = '#00ff88';
                        ctx.beginPath();
                        ctx.arc(screenX, cp.y + 23, 11, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });
            }

            // 5. Particles & Character
            if (gameState === 'PLAYING' && player.isGrounded) {
                createTrail(player.x - cameraX, player.y, levelConfig);
            }
            drawParticles(ctx);

            if (gameState === 'PLAYING') {
                drawDiazCharacter(ctx, player.x - cameraX, player.y, player.size, player.rotation, player.gravityFlipped);
            }

            ctx.restore();
        }

        // --- GAME LOOP ---
        function gameLoop() {
            const groundY = canvas.height - 120;
            const levelConfig = LEVELS[currentLevelIdx];

            if (gameState === 'PLAYING') {
                player.update(groundY, levelConfig.speed, obstacles);
                cameraX = player.x - 120;

                const progressPct = Math.min(100, Math.floor((player.x / levelWidth) * 100));
                document.getElementById('progress-bar').style.width = progressPct + '%';
                document.getElementById('score-counter').textContent = `${progressPct}%`;

                if (progressPct > highScores[currentLevelIdx]) {
                    highScores[currentLevelIdx] = progressPct;
                    document.getElementById('high-score-display').textContent = `BEST: ${progressPct}%`;
                }

                if (checkCollisions(groundY)) {
                    triggerGameOver(false);
                }

                if (player.x >= levelWidth) {
                    triggerGameOver(true);
                }
            }

            updateParticles();
            drawScene();

            requestAnimationFrame(gameLoop);
        }

        // --- STATE & CONTROLS ---
        function startGame() {
            const groundY = canvas.height - 120;
            const levelConfig = LEVELS[currentLevelIdx];

            if (!practiceMode) {
                activeCheckpoint = null;
                practiceCheckpoints = [];
            }

            buildLevelMap(levelConfig, groundY);
            player.reset(groundY);

            gameState = 'PLAYING';
            particles = [];

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-over-modal').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('mobile-controls').classList.remove('hidden');
            document.getElementById('attempt-counter').textContent = `ATTEMPT ${attempts}`;
            document.getElementById('practice-indicator').classList.toggle('hidden', !practiceMode);
            document.getElementById('practice-add-cp-btn').classList.toggle('hidden', !practiceMode);
            document.getElementById('practice-del-cp-btn').classList.toggle('hidden', !practiceMode);

            audioSynth.startMusic(levelConfig.bpm);
        }

        function triggerGameOver(isVictory) {
            gameState = isVictory ? 'VICTORY' : 'GAMEOVER';
            audioSynth.stopMusic();

            const levelConfig = LEVELS[currentLevelIdx];

            if (isVictory) {
                audioSynth.playWinSound();
                createConfetti();
            } else {
                audioSynth.playExplosionSound();
                screenShake = 12;
                createExplosion(player.x - cameraX + player.size / 2, player.y + player.size / 2, levelConfig);
            }

            if (!isVictory && autoRestart) {
                setTimeout(() => {
                    attempts++;
                    startGame();
                }, 400);
                return;
            }

            setTimeout(() => {
                const modal = document.getElementById('game-over-modal');
                const title = document.getElementById('modal-title');
                const sub = document.getElementById('modal-sub');

                const progressPct = Math.min(100, Math.floor((player.x / levelWidth) * 100));

                if (isVictory) {
                    title.textContent = "LEVEL COMPLETE!";
                    title.className = "text-5xl md:text-7xl font-black text-yellow-400 neon-text-gold mb-2 text-center";
                    sub.textContent = `100% Completed on ${levelConfig.name}! Attempts: ${attempts}`;
                } else {
                    title.textContent = "GAME OVER";
                    title.className = "text-5xl md:text-7xl font-black text-red-500 neon-text-gold mb-2 text-center";
                    sub.textContent = `Reached ${progressPct}% in ${levelConfig.name}`;
                    if (!practiceMode) attempts++;
                }

                modal.classList.remove('hidden');
            }, isVictory ? 200 : 400);
        }

        function addCheckpoint() {
            if (practiceMode && gameState === 'PLAYING') {
                const cp = {
                    x: player.x,
                    y: player.y,
                    gravityFlipped: player.gravityFlipped
                };
                practiceCheckpoints.push(cp);
                activeCheckpoint = cp;
                audioSynth.playCheckpointSound();
            }
        }

        function removeCheckpoint() {
            if (practiceMode && practiceCheckpoints.length > 0) {
                practiceCheckpoints.pop();
                activeCheckpoint = practiceCheckpoints.length > 0 ? practiceCheckpoints[practiceCheckpoints.length - 1] : null;
            }
        }

        // --- INPUT HANDLING ---
        function pressJump(e) {
            if (e) e.preventDefault();
            isHoldingJump = true;
            if (gameState === 'PLAYING') {
                player.jump();
            }
        }

        function releaseJump(e) {
            if (e) e.preventDefault();
            isHoldingJump = false;
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                pressJump(e);
            } else if (e.code === 'KeyZ') {
                addCheckpoint();
            } else if (e.code === 'KeyX') {
                removeCheckpoint();
            } else if (e.code === 'KeyR') {
                if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                    startGame();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                releaseJump(e);
            }
        });

        canvas.addEventListener('mousedown', pressJump);
        canvas.addEventListener('mouseup', releaseJump);
        canvas.addEventListener('touchstart', pressJump, { passive: false });
        canvas.addEventListener('touchend', releaseJump, { passive: false });

        const mobileJumpBtn = document.getElementById('mobile-jump-btn');
        mobileJumpBtn.addEventListener('touchstart', pressJump, { passive: false });
        mobileJumpBtn.addEventListener('touchend', releaseJump, { passive: false });
        mobileJumpBtn.addEventListener('mousedown', pressJump);
        mobileJumpBtn.addEventListener('mouseup', releaseJump);

        // UI Event Listeners
        document.getElementById('start-btn').addEventListener('click', () => {
            attempts = 1;
            startGame();
        });

        document.getElementById('retry-btn').addEventListener('click', startGame);

        document.getElementById('menu-btn').addEventListener('click', () => {
            document.getElementById('game-over-modal').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('mobile-controls').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            gameState = 'MENU';
        });

        document.getElementById('in-game-restart-btn').addEventListener('click', startGame);

        // Pause / Main Menu Button Handlers
        document.getElementById('in-game-menu-btn').addEventListener('click', () => {
            gameState = 'MENU';
            audioSynth.stopMusic();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('mobile-controls').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('game-over-modal').classList.add('hidden');
        });

        document.getElementById('in-game-pause-btn').addEventListener('click', () => {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                audioSynth.stopMusic();
                document.getElementById('in-game-pause-btn').textContent = 'Resume';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                audioSynth.startMusic(LEVELS[currentLevelIdx].bpm);
                document.getElementById('in-game-pause-btn').textContent = 'Pause';
            }
        });

        document.getElementById('practice-add-cp-btn').addEventListener('click', addCheckpoint);
        document.getElementById('practice-del-cp-btn').addEventListener('click', removeCheckpoint);

        function updateLevelUI() {
            const level = LEVELS[currentLevelIdx];
            document.getElementById('level-title').textContent = level.name;
            document.getElementById('level-desc').textContent = level.desc;
            document.getElementById('hud-level-name').textContent = level.name;
            document.getElementById('high-score-display').textContent = `BEST: ${highScores[currentLevelIdx]}%`;
        }

        document.getElementById('prev-level-btn').addEventListener('click', () => {
            currentLevelIdx = (currentLevelIdx - 1 + LEVELS.length) % LEVELS.length;
            updateLevelUI();
        });

        document.getElementById('next-level-btn').addEventListener('click', () => {
            currentLevelIdx = (currentLevelIdx + 1) % LEVELS.length;
            updateLevelUI();
        });

        document.getElementById('practice-toggle-btn').addEventListener('click', () => {
            practiceMode = !practiceMode;
            const status = document.getElementById('practice-status');
            status.textContent = practiceMode ? 'ON' : 'OFF';
            status.className = practiceMode ? 'text-green-400' : 'text-red-400';
        });

        document.getElementById('auto-restart-toggle-btn').addEventListener('click', () => {
            autoRestart = !autoRestart;
            const status = document.getElementById('auto-restart-status');
            status.textContent = autoRestart ? 'ON' : 'OFF';
            status.className = autoRestart ? 'text-green-400' : 'text-red-400';
        });

        const audioBtn = document.getElementById('audio-toggle-btn');
        audioBtn.addEventListener('click', () => {
            const isMuted = audioSynth.toggleMute();
            audioBtn.textContent = isMuted ? '🔇 Sound: OFF' : '🔊 Sound: ON';
        });

        window.onload = function() {
            updateLevelUI();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
